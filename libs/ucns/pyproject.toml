[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ucns"
version = "0.0.0.dev0"
description = "UCNS geometric and topological construction research"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Erin Spencer"}]
dependencies = ["mpmath>=1.3", "numpy>=1.24"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1",
  "build==1.5.0",
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "uv==0.11.18",
  "tomli>=2; python_version < '3.11'",
  "mpmath>=1.3,<2",
  "sympy>=1.12,<2",
]
research = [
  "mpmath>=1.3,<2",
  "sympy>=1.12,<2",
]
build = ["build==1.5.0", "twine==7.0.0", "setuptools==84.0.0", "wheel==0.48.0", "tomli>=2; python_version < '3.11'"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
collect_imported_tests = false
addopts = "-q"
