<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AHBG presentation board</title>
    <link rel="stylesheet" href="board.css" />
  </head>
  <body>
    <main>
      <section class="board-wrap">
        <h1>AHBG plane</h1>
        <p class="note">Presentation only. Not mechanics. Click a tile to inspect it.</p>
        <svg id="board" role="img" aria-label="seven-tile hex neighborhood with A0"></svg>
      </section>
      <aside class="feed">
        <h2>Feed</h2>
        <ol id="feed-list"></ol>
        <p class="inspect" id="inspect"></p>
      </aside>
    </main>
    <script src="board.js"></script>
  </body>
</html>
