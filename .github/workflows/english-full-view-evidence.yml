name: english-full-view-evidence

on:
  pull_request:
    paths:
      - 'research/english-gonol/**'
      - '.github/workflows/english-full-view-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'research/english-gonol/**'
      - '.github/workflows/english-full-view-evidence.yml'

permissions:
  contents: read

jobs:
  sealed-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay the archived four-view evidence
        env:
          ARCHIVE: dbf50f00695d54030cc8cde5fda557cd03e44f50
        run: |
          git diff --exit-code "$ARCHIVE" -- research/english-gonol/FULL_VIEW_AUDIT.json research/english-gonol/experiments/hyperspace-views-full-v1
          git worktree add --detach "$RUNNER_TEMP/english-views" "$ARCHIVE"
          cd "$RUNNER_TEMP/english-views/research/english-gonol"
          python -m unittest discover -s tests -p test_full_view_audit.py -v
