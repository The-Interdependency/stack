name: english-gonol

on:
  push:
    paths:
      - "research/english-gonol/**"
      - "libs/ucns/**"
      - ".github/workflows/english-gonol.yml"
      - "tools/qualify_language_gonols.py"
      - "tools/tests/test_language_qualification.py"
      - "requirements-language-tests.txt"
  pull_request:
    paths:
      - "research/english-gonol/**"
      - "libs/ucns/**"
      - ".github/workflows/english-gonol.yml"
      - "tools/qualify_language_gonols.py"
      - "tools/tests/test_language_qualification.py"
      - "requirements-language-tests.txt"

permissions:
  contents: read

jobs:
  english-gonol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.14"

      - name: Checkout exact historical lexical test authority
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/ucns
          ref: d7c6f51304ed6c32d48badf63132bea6de8af497
          path: .ci/ucns-lexical
          persist-credentials: false

      - name: Install pytest
        run: python -m pip install --require-hashes -r requirements-language-tests.txt

      - name: English Gonol construction tests
        working-directory: research/english-gonol
        env:
          ENGLISH_GONOL_UCNS_ROOT: ${{ github.workspace }}/.ci/ucns-lexical
        run: python -m pytest -q tests --junitxml="$RUNNER_TEMP/english-gonol.xml"

      - name: Require every test to pass
        run: python tools/qualify_language_gonols.py check-tests "$RUNNER_TEMP/english-gonol.xml"
