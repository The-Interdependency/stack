name: AHBG deployed Android acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ahbg/android/alpha-release.json"
      - "ahbg/android/smoke_phone.py"
      - ".github/workflows/ahbg-phone-acceptance.yml"
permissions:
  contents: read
jobs:
  signed-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and verify the deployed APK
        run: |
          curl --fail --location --retry 3 -o /tmp/ahbg-alpha.apk https://ahbg.35.212.252.101.sslip.io/download/ahbg-alpha.apk
          python - <<'PY'
          import hashlib, json, pathlib
          release = json.loads(pathlib.Path("ahbg/android/alpha-release.json").read_text())
          assert hashlib.sha256(pathlib.Path("/tmp/ahbg-alpha.apk").read_bytes()).hexdigest() == release["sha256"]
          PY
      - name: Grant the runner access to its emulator accelerator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, play two unit orders, close and reconnect
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          cores: 2
          disable-animations: true
          script: |
            adb install /tmp/ahbg-alpha.apk
            python3 ahbg/android/smoke_phone.py ${{ github.event_name == 'workflow_dispatch' && '--scouting' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-visible-screen
          path: /tmp/ahbg-android-screen.png
          if-no-files-found: ignore
