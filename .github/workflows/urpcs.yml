name: urpcs

on:
  pull_request:
    paths:
      - "research/urpcs/**"
      - "libs/ucns/src/ucns/direct_mobius.py"
      - ".github/workflows/urpcs.yml"
  push:
    branches: [main]
    paths:
      - "research/urpcs/**"
      - "libs/ucns/src/ucns/direct_mobius.py"
      - ".github/workflows/urpcs.yml"

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate relational evidence
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python -m pip install --disable-pip-version-check pycryptodome
          clone_at() {
            repo="$1"
            sha="$2"
            dest="$3"
            git init -q "$dest"
            git -C "$dest" remote add origin "$repo"
            git -C "$dest" fetch -q --depth=1 origin "$sha"
            git -C "$dest" checkout -q --detach FETCH_HEAD
          }
          clone_at https://github.com/The-Interdependency/ucns.git 4086ab82399c4d142b0eacfbc09e0a69ed151aa5 /tmp/ucns
          clone_at https://github.com/The-Interdependency/skill-lib.git 22c2c5702d14fb4b0faeb717777ecab2665770a1 /tmp/skill-lib
          clone_at https://github.com/The-Interdependency/metapat.git e4165b0cac9eca41daef9c2f941881028ca55d48 /tmp/metapat
          python research/urpcs/urpcs_relational_analyzer.py \
            --stack-root "$GITHUB_WORKSPACE" \
            --ucns-root /tmp/ucns \
            --skill-lib-root /tmp/skill-lib \
            --metapat-root /tmp/metapat \
            --kmac-backend pycryptodome \
            --write-receipt research/urpcs/receipts/urpcs-relational-carrier-v0.json \
            --write-report research/urpcs/docs/URPCS-relational-carrier-v0.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/urpcs/receipts/urpcs-relational-carrier-v0.json research/urpcs/docs/URPCS-relational-carrier-v0.md
          if git diff --cached --quiet; then
            echo "Evidence already current"
          else
            git commit -m "chore(urpcs): regenerate relational evidence"
            git push origin "HEAD:$HEAD_REF"
          fi
      - name: Independent decoder replay
        run: node research/urpcs/tests/test_independent_decoder.js
      - name: Reference codec and committed-vector checks
        run: python -m unittest discover -s research/urpcs/tests -p 'test*.py'
      - name: Python syntax
        run: >-
          python -m py_compile
          research/urpcs/urpcs_v1_reference.py
          research/urpcs/urpcs_mobius_projection.py
          research/urpcs/urpcs_relational_analyzer.py
