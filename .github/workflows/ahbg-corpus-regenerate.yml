name: ahbg-corpus-regenerate-once

on:
  push:
    branches:
      - fix/ahbg-war-v3-canonical
    paths:
      - .github/workflows/ahbg-corpus-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify corpus identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("ahbg/deepseek/corpus-proposal/corpus.json")
          raw = path.read_bytes()
          corpus = json.loads(raw)
          authority = corpus.get("board", {}).get("authority")
          expected = "UCNS mobius_seed band centers (libs/ucns/src/ucns/mobius_seed.py)"
          assert authority == expected, (authority, expected)
          digest = hashlib.sha256(raw).hexdigest()
          sidecar = Path("ahbg/deepseek/corpus-proposal/CORPUS.sha256").read_text().strip()
          assert digest == sidecar, (digest, sidecar)
          runner = Path("ahbg/grok/run_common_corpus.py").read_text()
          assert f'CORPUS_FILE_SHA256 = "{digest}"' in runner
          print(f"corpus_sha256={digest}")
          PY

      - name: Repair generated runner source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("ahbg/grok/run_common_corpus.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          first = '- This is a post-freeze common-corpus execution against the exact committed runner identity recorded above.'
          second = '- Baseline reciprocal-review freeze remains `cce9cec`; current war_v3 code intentionally diverges from it.'
          found = False
          for index, line in enumerate(lines[:-1]):
              if line.strip() == f'"{first}' and lines[index + 1].strip() == f'{second}",':
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index] = f'{indent}"{first}",'
                  lines[index + 1] = f'{indent}"{second}",'
                  found = True
                  break
          if not found:
              joined = "\n".join(lines)
              if f'"{first}",' not in joined or f'"{second}",' not in joined:
                  raise SystemExit("malformed note pair not found in expected old or repaired form")
          # Cosmetic indentation only; semantics were already transformed.
          lines = [
              ('            "baseline_freeze_sha": BASELINE_FREEZE_SHA,' if line == '        "baseline_freeze_sha": BASELINE_FREEZE_SHA,' else line)
              for line in lines
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Compile repaired runner
        run: python -m py_compile ahbg/grok/run_common_corpus.py

      - name: Commit repaired runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ahbg/grok/run_common_corpus.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(ahbg): repair corpus runner regeneration syntax"
            git push origin HEAD:fix/ahbg-war-v3-canonical
          fi

      - name: Run Grok test suites
        shell: bash
        run: |
          set -euo pipefail
          cd ahbg/grok
          python -m unittest discover -s a0/tests -p 'test*.py'
          python -m unittest discover -s ahbg/tests -p 'test*.py'
          python -m unittest discover -s tests -p 'test*.py'

      - name: Regenerate committed evidence
        shell: bash
        run: |
          set -euo pipefail
          cd ahbg/grok
          python run.py
          python run_common_corpus.py
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("corpus-run/calibration-family-1.0.1-proposal-1/CALIBRATION_RESULT.json").read_text(encoding="utf-8"))
          expected = {"survived": 35, "falsified": 0, "unresolved": 0, "blocked": 0}
          assert result.get("summary") == expected, result.get("summary")
          assert len(result.get("results", [])) == 35
          assert all(row.get("replay_equal") is True for row in result["results"])
          PY
          cd ../..
          git add ahbg/grok/CALIBRATION_RESULT.json \
                  ahbg/grok/EVENTS.jsonl \
                  ahbg/grok/artifacts \
                  ahbg/grok/corpus-run/calibration-family-1.0.1-proposal-1
          if ! git diff --cached --quiet; then
            git commit -m "chore(ahbg): regenerate evidence from committed war_v3 source"
            git push origin HEAD:fix/ahbg-war-v3-canonical
          fi
