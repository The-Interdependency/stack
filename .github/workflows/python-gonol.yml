name: python-gonol

on:
  pull_request:
    paths:
      - "research/python-gonol/**"
      - "libs/ucns/**"
      - "README.md"
      - "AGENTS.md"
      - "STACK_MANIFEST.md"
      - "stack-manifest.json"
      - ".github/workflows/python-gonol.yml"
      - "tools/qualify_language_gonols.py"
      - "tools/tests/test_language_qualification.py"
      - "requirements-language-tests.txt"
  push:
    branches: [main]
    paths:
      - "research/python-gonol/**"
      - "libs/ucns/**"
      - "README.md"
      - "AGENTS.md"
      - "STACK_MANIFEST.md"
      - "stack-manifest.json"
      - ".github/workflows/python-gonol.yml"
      - "tools/qualify_language_gonols.py"
      - "tools/tests/test_language_qualification.py"
      - "requirements-language-tests.txt"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install pytest
        run: python -m pip install --require-hashes -r requirements-language-tests.txt
      - name: Stack structural consistency
        run: python tools/check_stack_consistency.py
      - name: Checkout pinned UCNS Public Gonol authority
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/ucns
          ref: 62e08ee1cf3b5d7b6e48c927b1047509e6328b5c
          path: .ci/ucns
          persist-credentials: false
      - name: Python Gonol construction tests
        working-directory: research/python-gonol
        env:
          UCNS_SOURCE_ROOT: ${{ github.workspace }}/.ci/ucns
        run: python -m pytest -q tests ../../tools/tests/test_language_qualification.py --junitxml="$RUNNER_TEMP/python-gonol.xml"
      - name: Require every test to pass
        run: python tools/qualify_language_gonols.py check-tests "$RUNNER_TEMP/python-gonol.xml"
