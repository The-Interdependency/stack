name: EPAC release consumption and carrier research

on:
  pull_request:
    paths: ["integration/epac/**", "research/epac/**", "research/epac-carrier/**", "stack-manifest.json", "STACK_MANIFEST.md", ".github/workflows/epac.yml"]
  push:
    branches: [main]
    paths: ["integration/epac/**", "research/epac/**", "research/epac-carrier/**", "stack-manifest.json", "STACK_MANIFEST.md", ".github/workflows/epac.yml"]

permissions:
  contents: read

jobs:
  carrier-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: The-Interdependency/epac
          ref: 7b3d99af9a456d2587e0489d7400e6f8b58c8a82
          path: _upstream/epac
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the research test dependency
        run: python -m pip install pytest==8.4.2
      - name: Test bounded carrier research against pinned EPAC source
        working-directory: research/epac-carrier
        env:
          EPAC_SOURCE_ROOT: ${{ github.workspace }}/_upstream/epac
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests
  released-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the pinned environment manager
        run: python -m pip install uv==0.11.18
      - name: Check Stack projections
        run: python tools/check_stack_consistency.py
      - name: Reconsume immutable EPAC release
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python integration/epac/reconsume.py integration/epac/release-lock.json /tmp/epac-public-consumption python
      - uses: actions/upload-artifact@v7
        with:
          name: epac-public-consumption
          path: |
            /tmp/epac-public-consumption/consumption.json
            /tmp/epac-public-consumption/release-lock.json
          if-no-files-found: error
