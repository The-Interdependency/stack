name: backend fresh-making tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/cli/**'
      - 'skill-lib/msdmd/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/cli/**'
      - 'skill-lib/msdmd/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the event source with GitHub PR isolation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python (the backend's minimum, 3.11)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # PostgreSQL integration tests skip without STACK_TEST_DATABASE_URL; they
      # remain VM deployment gates (backend/deploy/VM_SETUP.md).
      - name: Run backend unit tests
        run: |
          set -euo pipefail
          bash -n backend/ops/*.sh
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s backend/tests -t . -v
