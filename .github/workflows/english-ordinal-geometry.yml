name: English ordinal forge
on:
  pull_request:
    paths: ['research/english-gonol/**', '.github/workflows/english-ordinal-geometry.yml']
  push:
    branches: [main]
    paths: ['research/english-gonol/**', '.github/workflows/english-ordinal-geometry.yml']
permissions:
  contents: read
jobs:
  ordinal-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/ucns
          ref: ed0b0760f05cd975a7a811f8abeb70a11d09f00b
          path: _deps/ucns-ordinal
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.14'
      - name: Verify source graph and producer
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          graph = json.loads(Path('research/english-gonol/docs/ordinal-work-graph.json').read_text())
          payload = {key: graph[key] for key in ('repositories', 'boundaries')}
          assert hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()).hexdigest() == graph['work_graph_sha256']
          producer = next(r for r in graph['repositories'] if r['repository'] == 'The-Interdependency/ucns')
          assert subprocess.check_output(['git', '-C', '_deps/ucns-ordinal', 'rev-parse', 'HEAD'], text=True).strip() == producer['commit']
          assert graph['boundaries']['authority_transfer'] is False
          PY
      - name: Install selected UCNS producer
        run: |
          python -m pip install ./_deps/ucns-ordinal
          python -m pip install pytest==8.3.5 PyYAML==6.0.2
      - name: Exercise native ordinal candidate
        env:
          PYTHONPATH: research/english-gonol
        run: |
          mkdir -p _state
          python -m pytest -q research/english-gonol/ordinal_tests/test_ordinal_construction.py --junitxml=_state/ordinal.xml
          python -m english_gonol.ordinal_construction word > _state/word.json
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('_state/ordinal.xml').getroot().iter('testsuite'))
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'errors', 'failures', 'skipped')}
          assert totals['tests'] >= 10 and totals['errors'] == totals['failures'] == totals['skipped'] == 0, totals
          print(totals)
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: english-ordinal-forge
          path: |
            _state/ordinal.xml
            _state/word.json
          if-no-files-found: error
